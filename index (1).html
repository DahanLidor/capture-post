<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Capture → Post</title>
<!--
  ============================================================================
  CAPTURE → POST  (simplified POC)
  ============================================================================
  FLOW
    1. Name the post
    2. ONE circle captures:  Photo (tap) · Video (tap start/stop) · Voice (tap)
       Every capture is stamped with time + the latest GPS fix.
    3. (Optional) drop in a SCREENSHOT of a post whose style/vibe to borrow.
    4. "Done" -> background pipeline -> shows 2 draft posts.

  WHERE THE REAL AI GOES
    Search for  >>> SWAP POINT <<<  — that one function (generateDrafts) is the
    only place to wire your backend. Replace its mock with a fetch to a service
    that does:  audio -> speech-to-text,  style screenshot -> vision model,
    then  LLM(timeline + style profile + tone/language) -> 2 captions.
    Everything else (capture, GPS, UI) stays exactly as-is.

  RUN IT  (mic/camera/GPS need a secure context)
    - Local:        python3 -m http.server 8000  ->  http://localhost:8000
    - GitHub Pages: push as index.html, enable Pages -> https:// URL works on phones.
    Note: a web tab can't record while backgrounded/screen-locked (mobile Safari).
  ============================================================================
-->
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#191c20; --muted:#6b7480; --line:#e4e7ec;
    --accent:#f0452f; --accent-soft:#fdecea; --ok:#1f9d6b;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       -webkit-font-smoothing:antialiased}
  .app{max-width:520px;margin:0 auto;min-height:100vh;padding:24px 18px 40px;
       display:flex;flex-direction:column}
  .title{font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
          color:var(--muted);text-align:center;margin:4px 0 22px}

  .banner{background:var(--accent-soft);border:1px solid var(--accent);color:#9c2a1a;
          border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:16px}
  .hidden{display:none !important}

  input[type=text]{width:100%;background:var(--card);border:1px solid var(--line);
        color:var(--ink);border-radius:14px;padding:15px 16px;font-size:17px;text-align:center}
  input[type=text]::placeholder{color:var(--muted)}
  input[type=text]:focus{outline:none;border-color:var(--ink)}

  .gps{display:flex;justify-content:center;margin:14px 0 6px}
  .gps span{font-family:var(--mono);font-size:11px;color:var(--muted);
            display:flex;align-items:center;gap:6px}
  .gdot{width:7px;height:7px;border-radius:50%;background:#c2c8d0}
  .gdot.on{background:var(--ok)}

  .stage{position:relative;margin:10px 0;border-radius:18px;overflow:hidden;background:#0c0e10;
         aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
  .stage video{width:100%;height:100%;object-fit:cover}
  .stage .placeholder{color:#5a6068;font-size:14px;text-align:center;padding:24px}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .flash.go{animation:flash .35s ease-out}
  @keyframes flash{0%{opacity:.9}100%{opacity:0}}

  .modes{display:flex;justify-content:center;gap:8px;margin:18px 0 14px}
  .mode{font-size:13px;font-weight:500;color:var(--muted);background:var(--card);
        border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
  .mode.active{color:#fff;background:var(--ink);border-color:var(--ink)}

  .circle-wrap{display:flex;justify-content:center;margin:6px 0 4px}
  .circle{width:92px;height:92px;border-radius:50%;background:var(--card);
          border:4px solid var(--ink);cursor:pointer;position:relative;
          display:flex;align-items:center;justify-content:center;
          transition:transform .12s ease, border-color .2s}
  .circle:active{transform:scale(.94)}
  .circle .core{width:66px;height:66px;border-radius:50%;background:var(--accent);
                transition:all .2s ease}
  .circle.recording{border-color:var(--accent);animation:ring 1.1s ease-in-out infinite}
  .circle.recording .core{width:30px;height:30px;border-radius:8px}
  @keyframes ring{0%,100%{box-shadow:0 0 0 0 var(--accent-soft)}50%{box-shadow:0 0 0 10px var(--accent-soft)}}
  .hint{text-align:center;font-size:13px;color:var(--muted);margin:10px 0 0}
  .timer{text-align:center;font-family:var(--mono);font-size:13px;color:var(--accent);
         margin-top:8px;height:16px}

  .strip{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0 4px;min-height:8px}
  .thumb{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);
         background:var(--card);overflow:hidden;position:relative;display:flex;
         align-items:center;justify-content:center;font-size:18px;color:var(--muted)}
  .thumb img{width:100%;height:100%;object-fit:cover}

  .styleref{margin:20px 0 10px;border:1px dashed var(--line);border-radius:14px;
            padding:14px;background:var(--card);text-align:center}
  .styleref .lbl{font-size:13px;color:var(--muted)}
  .styleref .picked{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:8px}
  .styleref img{width:42px;height:42px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
  .link{color:var(--accent);font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

  .spacer{flex:1}
  .done{width:100%;background:var(--ink);color:#fff;border:none;border-radius:14px;
        padding:17px;font-size:17px;font-weight:600;cursor:pointer;margin-top:18px}
  .done:disabled{opacity:.35;cursor:not-allowed}

  .processing{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
  .spinner{width:54px;height:54px;border-radius:50%;border:4px solid var(--line);
           border-top-color:var(--accent);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pmsg{font-size:15px;color:var(--muted);min-height:22px;text-align:center}

  .results h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;
              text-align:center;margin:4px 0 18px;font-weight:600}
  .draft{background:var(--card);border:1px solid var(--line);border-radius:16px;
         padding:16px;margin-bottom:14px}
  .draft .vibe{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;
               letter-spacing:.05em;margin-bottom:8px}
  .draft .body{font-size:15px;line-height:1.55;white-space:pre-wrap}
  .draft .copy{margin-top:12px;font-size:13px;color:var(--muted);background:transparent;
               border:1px solid var(--line);border-radius:10px;padding:7px 14px;cursor:pointer}
  .restart{width:100%;background:transparent;color:var(--ink);border:1px solid var(--line);
           border-radius:14px;padding:15px;font-size:15px;font-weight:500;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<div class="app">
  <div class="title">Capture → Post</div>
  <div id="insecure" class="banner hidden">
    Mic, camera and GPS are blocked here. Open via <b>http://localhost</b> or an <b>https://</b> URL.
  </div>

  <!-- ====== SCREEN 1: CAPTURE ====== -->
  <div id="capture">
    <input id="postName" type="text" placeholder="Name this post…">

    <div class="gps"><span><i id="gdot" class="gdot"></i><span id="gtext">locating…</span></span></div>

    <div id="stage" class="stage">
      <video id="preview" autoplay playsinline muted class="hidden"></video>
      <div id="placeholder" class="placeholder">Pick a mode below, then tap the circle</div>
      <div id="flash" class="flash"></div>
    </div>
    <canvas id="canvas" class="hidden"></canvas>

    <div class="modes">
      <button class="mode active" data-mode="photo">Photo</button>
      <button class="mode" data-mode="video">Video</button>
      <button class="mode" data-mode="voice">Voice</button>
    </div>

    <div class="circle-wrap">
      <div id="circle" class="circle"><div class="core"></div></div>
    </div>
    <div id="hint" class="hint">Tap to take a photo</div>
    <div id="timer" class="timer"></div>

    <div id="strip" class="strip"></div>

    <div class="styleref">
      <div class="lbl">Borrow a vibe — <span id="pickStyle" class="link">add a screenshot of a post you like</span></div>
      <input id="styleFile" type="file" accept="image/*" class="hidden">
      <div id="stylePicked" class="picked hidden"><img id="styleImg" alt="style reference"><span id="styleName" style="font-size:13px;color:var(--muted)"></span></div>
    </div>

    <div class="spacer"></div>
    <button id="doneBtn" class="done" disabled>Done</button>
  </div>

  <!-- ====== SCREEN 2: PROCESSING ====== -->
  <div id="processing" class="processing hidden">
    <div class="spinner"></div>
    <div id="pmsg" class="pmsg"></div>
  </div>

  <!-- ====== SCREEN 3: RESULTS ====== -->
  <div id="results" class="results hidden">
    <h3>Two drafts</h3>
    <div id="drafts"></div>
    <button id="restartBtn" class="restart">Start a new post</button>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

let mode = "photo";
let lastFix = null;
let stream = null;
let recorder = null, chunks = [], recording = false, tStart = 0, tInt = null;
let events = [];
let styleRef = null;
let postName = "";

if (!window.isSecureContext) $("insecure").classList.remove("hidden");

if ("geolocation" in navigator){
  navigator.geolocation.watchPosition(
    p => { lastFix = { lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), accuracy:Math.round(p.coords.accuracy) };
           $("gdot").classList.add("on"); $("gtext").textContent = `${lastFix.lat}, ${lastFix.lng}`; },
    e => { $("gtext").textContent = "gps unavailable"; },
    { enableHighAccuracy:true, maximumAge:5000, timeout:15000 }
  );
} else { $("gtext").textContent = "gps unsupported"; }

$("postName").addEventListener("input", e => { postName = e.target.value.trim(); refreshDone(); });
function refreshDone(){ $("doneBtn").disabled = !(postName && events.length); }

document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", async () => {
  if (recording) return;
  document.querySelectorAll(".mode").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  mode = b.dataset.mode;
  $("hint").textContent = mode==="photo" ? "Tap to take a photo"
                        : mode==="video" ? "Tap to start / stop video"
                        : "Tap to start / stop voice note";
  await setupForMode();
}));

async function setupForMode(){
  stopStream();
  if (mode === "voice"){
    $("preview").classList.add("hidden");
    $("placeholder").classList.remove("hidden");
    $("placeholder").textContent = "Voice mode — tap the circle to record";
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" }, audio:true });
    $("preview").srcObject = stream;
    $("preview").classList.remove("hidden");
    $("placeholder").classList.add("hidden");
  } catch(err){
    $("placeholder").classList.remove("hidden");
    $("placeholder").textContent = "Camera unavailable: " + err.message;
  }
}
function stopStream(){ if (stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }

$("circle").addEventListener("click", () => {
  if (mode === "photo") capturePhoto();
  else toggleRecording();
});

function capturePhoto(){
  if (!stream) return;
  const v = $("preview"), c = $("canvas");
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v,0,0);
  $("flash").classList.remove("go"); void $("flash").offsetWidth; $("flash").classList.add("go");
  c.toBlob(b => addEvent("photo",{ url:URL.createObjectURL(b), width:c.width, height:c.height }), "image/jpeg", .9);
}

async function toggleRecording(){
  if (recording){ recorder.stop(); return; }
  let src = stream;
  if (mode === "voice"){
    try { src = await navigator.mediaDevices.getUserMedia({ audio:true }); }
    catch(err){ alert("Mic unavailable: "+err.message); return; }
  }
  const mime = pickMime(mode);
  recorder = new MediaRecorder(src, mime ? {mimeType:mime} : undefined);
  chunks = [];
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime || "" });
    if (mode === "voice") src.getTracks().forEach(t=>t.stop());
    addEvent(mode, { url:URL.createObjectURL(blob), bytes:blob.size, mime:blob.type });
    setRecUI(false);
  };
  recorder.start();
  setRecUI(true);
}

function pickMime(m){
  const v = ["video/mp4","video/webm;codecs=vp9,opus","video/webm"];
  const a = ["audio/mp4","audio/webm;codecs=opus","audio/webm"];
  const list = m==="video" ? v : a;
  return list.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
}

function setRecUI(on){
  recording = on;
  $("circle").classList.toggle("recording", on);
  if (on){ tStart = Date.now(); tInt = setInterval(()=> {
      const s = Math.floor((Date.now()-tStart)/1000);
      $("timer").textContent = `● ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
    }, 250);
  } else { clearInterval(tInt); $("timer").textContent = ""; }
}

function addEvent(type, extra){
  events.push(Object.assign({ type, timestamp:new Date().toISOString(),
    location: lastFix ? {...lastFix} : null }, extra));
  renderStrip(); refreshDone();
}
function renderStrip(){
  $("strip").innerHTML = events.map(e =>
    e.type==="photo" ? `<div class="thumb"><img src="${e.url}"></div>`
    : `<div class="thumb">${e.type==="video"?"▶":"🎤"}</div>`).join("");
}

$("pickStyle").addEventListener("click", () => $("styleFile").click());
$("styleFile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  if (styleRef) URL.revokeObjectURL(styleRef.url);
  styleRef = { url:URL.createObjectURL(f), name:f.name };
  $("styleImg").src = styleRef.url; $("styleName").textContent = f.name;
  $("stylePicked").classList.remove("hidden");
});

$("doneBtn").addEventListener("click", async () => {
  if (recording) recorder.stop();
  stopStream();
  show("processing");
  const steps = [
    "Ordering your timeline…",
    "Transcribing audio…",
    styleRef ? "Reading the style off your screenshot…" : "Setting the tone…",
    "Writing two drafts…"
  ];
  for (const s of steps){ $("pmsg").textContent = s; await wait(750); }
  renderDrafts(await generateDrafts());
  show("results");
});

function show(screen){
  ["capture","processing","results"].forEach(s => $(s).classList.toggle("hidden", s!==screen));
}
const wait = ms => new Promise(r => setTimeout(r, ms));

// ============================================================================
// >>> SWAP POINT <<<  — replace this mock with a fetch() to your backend.
// Backend: speech-to-text on audio, vision model on styleRef screenshot to
// extract a style profile, then LLM(timeline + profile + language) -> 2 captions.
// ============================================================================
async function generateDrafts(){
  const photos = events.filter(e=>e.type==="photo").length;
  const clips  = events.filter(e=>e.type==="video"||e.type==="voice").length;
  const place  = lastFix ? "right where it happened" : "somewhere worth remembering";
  const vibe   = styleRef ? "matched to your screenshot's vibe" : "default voice";
  return [
    { vibe:`Warm & personal · ${vibe}`,
      body:`What a "${postName}" to remember. ${photos} moments caught on camera, `+
           `${clips} clip${clips===1?"":"s"} of the sound of it all — ${place}. `+
           `Some days you just want to hold onto. This was one of them. ✨\n\n#${postName.replace(/\s+/g,"")} #moments` },
    { vibe:`Short & punchy · ${vibe}`,
      body:`"${postName}." ${photos} photos. ${clips} clip${clips===1?"":"s"}. Zero regrets. 🔥` }
  ];
}

function renderDrafts(drafts){
  $("drafts").innerHTML = drafts.map((d,i) => `
    <div class="draft">
      <div class="vibe">Example ${i+1} — ${d.vibe}</div>
      <div class="body" id="d${i}">${d.body}</div>
      <button class="copy" onclick="copyDraft(${i})">Copy</button>
    </div>`).join("");
}
window.copyDraft = (i) => navigator.clipboard?.writeText($("d"+i).textContent);

$("restartBtn").addEventListener("click", () => {
  events.forEach(e => e.url && URL.revokeObjectURL(e.url));
  if (styleRef) URL.revokeObjectURL(styleRef.url);
  events = []; styleRef = null; postName = "";
  $("postName").value = ""; $("strip").innerHTML = ""; $("timer").textContent = "";
  $("stylePicked").classList.add("hidden"); $("doneBtn").disabled = true;
  show("capture"); setupForMode();
});

setupForMode();
</script>
</body>
</html>
